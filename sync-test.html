
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ユウトの伝説</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101b39;color:white;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
main{max-width:520px;margin:auto;padding:20px}
h1{text-align:center;color:#ffdf69}
h2{font-size:20px}
.panel{background:#23345c;border:2px solid #526eae;border-radius:20px;padding:18px;margin:15px 0}
button,input{font:inherit;border-radius:12px;padding:12px;border:0}
button{background:#ffcf42;color:#192343;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
input{width:100%;margin:6px 0;background:white;color:#17213d}
.wide{width:100%;margin:7px 0}
.muted{color:#c3d0ed}
.hidden{display:none!important}
.hero{text-align:center;font-size:60px}
.xp{height:16px;background:#435577;border-radius:20px;overflow:hidden}
.xp div{height:100%;background:#ffcf42}
.task{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid #50638e}
.task span{flex:1;overflow-wrap:anywhere}
.done{opacity:.6;text-decoration:line-through}
.status{padding:12px;border-radius:12px;background:#34476d;margin:12px 0;overflow-wrap:anywhere}
.error{background:#743a46}
small{color:#c3d0ed}
</style>
</head>
<body>
<main>
<h1>⚡ ユウトの伝説 ⚡</h1>
<p style="text-align:center">自分で決める、ぼくだけの冒険！</p>

<div id="status" class="status">
接続を確認しています…
</div>

<section id="login" class="panel hidden">
<h2>🔐 家族ログイン</h2>
<input id="email" type="email" autocomplete="username" placeholder="メールアドレス">
<input id="password" type="password" autocomplete="current-password" placeholder="パスワード">
<button id="loginBtn" class="wide" onclick="login()">冒険をはじめる！</button>
<p class="muted">登録済みの家族アカウントでログインしてください。</p>
</section>

<section id="app" class="hidden">
<div class="panel">
<h2>🐲 冒険のステータス</h2>
<div class="hero">🐲</div>
<h2 id="level">LEVEL 1</h2>
<p id="points">⭐ 0 EXP</p>
<div class="xp"><div id="bar"></div></div>
<p class="muted">小さな一歩が、伝説になる！</p>
<button class="wide" onclick="refreshData()">🔄 最新データを読み込む</button>
</div>

<div class="panel">
<h2>⚔️ 今日のミッション</h2>
<p id="today" class="muted"></p>
<input id="newtask" maxlength="100" placeholder="自分でミッションを決めよう">
<button class="wide" onclick="addTask()">＋ ミッションを追加</button>
<div id="tasks"></div>
</div>

<div class="panel">
<h2>🎁 宝箱</h2>
<p id="reward">🔒 LEVEL 3 で宝箱が開く！</p>
</div>

<div class="panel">
<h2>📖 今日のふりかえり</h2>
<input id="diary" maxlength="300" placeholder="今日がんばったこと">
<button class="wide" onclick="saveDiary()">記録する</button>
<h2>🌱 成長の記録</h2>
<div id="history" class="muted"></div>
</div>

<div class="panel">
<h2>☁️ データ管理</h2>
<p class="muted">同じアカウントでログインすると、別の端末でも記録を読み込めます。</p>
<button class="wide" onclick="exportData()">📥 記録をバックアップ</button>
<button class="wide" onclick="logout()">ログアウト</button>
</div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL =
'https://dodziozbzggubpfncpzs.supabase.co';

const SUPABASE_KEY =
'sb_publishable_VEXNSeo4GrpEQ8W5WAZWdw_UGJhBhF8';

const DEFAULT_DATA = () => ({
  xp: 0,
  tasks: [],
  history: []
});

let db = null;
let currentUser = null;
let data = DEFAULT_DATA();
let busy = false;

const el = id => document.getElementById(id);

function message(text, error=false) {
  el('status').textContent = text;
  el('status').classList.toggle('error',error);
}

function todayKey() {
  return new Intl.DateTimeFormat('en-CA',{
    timeZone:'Asia/Tokyo',
    year:'numeric',
    month:'2-digit',
    day:'2-digit'
  }).format(new Date());
}

function displayDate() {
  return new Intl.DateTimeFormat('ja-JP',{
    timeZone:'Asia/Tokyo',
    year:'numeric',
    month:'long',
    day:'numeric'
  }).format(new Date());
}

function level() {
  return Math.floor(data.xp / 100) + 1;
}

function setBusy(value) {
  busy = value;
  document.querySelectorAll('#app button').forEach(b=>{
    b.disabled=value;
  });
}

function normalize(value) {
  const v = value && typeof value==='object'
    ? value : {};
  return {
    xp:Number.isFinite(v.xp) ? v.xp : 0,
    tasks:Array.isArray(v.tasks) ? v.tasks : [],
    history:Array.isArray(v.history) ? v.history : []
  };
}

function render() {
  el('level').textContent='LEVEL '+level();
  el('points').textContent='⭐ '+data.xp+' EXP';
  el('bar').style.width=(data.xp%100)+'%';
  el('today').textContent=displayDate();

  el('reward').textContent=level()>=3
    ? '🎉 LEVEL 3 達成！'
    : '🔒 LEVEL 3 で宝箱が開く！';

  const box=el('tasks');
  box.replaceChildren();

  const todayTasks=data.tasks
    .map((task,index)=>({task,index}))
    .filter(item=>item.task.date===todayKey());

  if(todayTasks.length===0) {
    const p=document.createElement('p');
    p.className='muted';
    p.textContent='今日はまだミッションがありません。';
    box.appendChild(p);
  }

  todayTasks.forEach(({task,index})=>{
    const div=document.createElement('div');
    div.className='task';

    const span=document.createElement('span');
    span.textContent=task.name;
    if(task.done)span.className='done';

    const button=document.createElement('button');
    button.textContent=task.done?'達成！':'クリア +20';
    button.disabled=task.done||busy;
    button.onclick=()=>completeTask(index);

    div.append(span,button);
    box.appendChild(div);
  });

  const history=el('history');
  history.replaceChildren();

  if(data.history.length===0) {
    history.textContent='まだ記録がありません';
  } else {
    data.history.slice(-12).reverse().forEach(entry=>{
      const p=document.createElement('p');
      p.textContent=String(entry);
      history.appendChild(p);
    });
  }
}

async function cloudRead() {
  const {data:row,error}=await db
    .from('family_progress')
    .select('progress')
    .eq('user_id',currentUser.id)
    .maybeSingle();

  if(error)throw error;
  return normalize(row?.progress);
}

async function cloudWrite(nextData) {
  const {error}=await db
    .from('family_progress')
    .upsert({
      user_id:currentUser.id,
      progress:nextData,
      updated_at:new Date().toISOString()
    },{onConflict:'user_id'});

  if(error)throw error;
}

async function refreshData() {
  if(!currentUser||busy)return;
  setBusy(true);
  message('☁️ 最新データを読み込んでいます…');

  try {
    data=await cloudRead();
    message('☁️ 最新データを読み込みました');
  } catch(error) {
    message('読み込み失敗: '+error.message,true);
  } finally {
    setBusy(false);
    render();
  }
}

async function changeData(change) {
  if(!currentUser||busy)return false;
  setBusy(true);
  message('☁️ 保存しています…');

  try {
    const latest=await cloudRead();
    const next=structuredClone(latest);
    const result=change(next);

    if(result===false) {
      data=latest;
      message('変更はありません');
      return false;
    }

    await cloudWrite(next);
    data=next;
    message('☁️ 保存成功！');
    return true;
  } catch(error) {
    message('保存失敗: '+error.message,true);
    alert('クラウドに保存できませんでした。通信状態を確認してください。');
    return false;
  } finally {
    setBusy(false);
    render();
  }
}

async function addTask() {
  const input=el('newtask');
  const name=input.value.trim();
  if(!name)return;

  const success=await changeData(next=>{
    next.tasks.push({
      id:crypto.randomUUID(),
      name,
      date:todayKey(),
      done:false
    });
  });

  if(success)input.value='';
}

async function completeTask(index) {
  const task=data.tasks[index];
  if(!task||task.done)return;

  const success=await changeData(next=>{
    const target=next.tasks.find(t=>t.id===task.id);
    if(!target||target.done)return false;

    target.done=true;
    next.xp+=20;
    next.history.push(
      displayDate()+' '+target.name+' 達成'
    );
  });

  if(success)alert('ミッションクリア！ +20 EXP ⭐');
}

async function saveDiary() {
  const input=el('diary');
  const note=input.value.trim();
  if(!note)return;

  const success=await changeData(next=>{
    next.history.push(displayDate()+' '+note);
  });

  if(success) {
    input.value='';
    alert('記録したよ！');
  }
}

async function login() {
  if(!db)return;

  const email=el('email').value.trim();
  const password=el('password').value;

  if(!email||!password) {
    message('メールアドレスとパスワードを入力してください',true);
    return;
  }

  el('loginBtn').disabled=true;
  message('ログインしています…');

  try {
    const {data:result,error}=await db.auth
      .signInWithPassword({email,password});

    if(error)throw error;
    if(!result.user)throw new Error('ログインできませんでした');

    currentUser=result.user;
    el('password').value='';
    el('login').classList.add('hidden');
    el('app').classList.remove('hidden');
    await refreshData();
  } catch(error) {
    message('ログイン失敗: '+error.message,true);
  } finally {
    el('loginBtn').disabled=false;
  }
}

async function logout() {
  if(!db)return;

  const {error}=await db.auth.signOut();

  if(error) {
    message('ログアウト失敗: '+error.message,true);
    return;
  }

  currentUser=null;
  data=DEFAULT_DATA();
  el('app').classList.add('hidden');
  el('login').classList.remove('hidden');
  message('ログアウトしました');
}

function exportData() {
  const blob=new Blob(
    [JSON.stringify(data,null,2)],
    {type:'application/json'}
  );
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='yuto-backup.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function init() {
  try {
    if(SUPABASE_KEY==='YOUR_PUBLISHABLE_KEY') {
      throw new Error('Publishable key が未設定です');
    }

    if(!window.supabase) {
      throw new Error('Supabase ライブラリを読み込めませんでした');
    }

    db=window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const result=await Promise.race([
      db.auth.getUser(),
      new Promise((_,reject)=>setTimeout(
        ()=>reject(new Error('接続がタイムアウトしました')),
        12000
      ))
    ]);

    if(result.error)throw result.error;

    if(result.data.user) {
      currentUser=result.data.user;
      el('app').classList.remove('hidden');
      await refreshData();
    } else {
      el('login').classList.remove('hidden');
      message('ログインしてください');
    }
  } catch(error) {
    el('login').classList.remove('hidden');
    message('接続エラー: '+error.message,true);
  }
}

render();
init();
</script>
</body>
</html>
